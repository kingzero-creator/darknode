<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKNODE — Sovereign Infrastructure</title>
<meta name="description" content="Run your own AI node. Local AI, mesh radio, off-grid payments. No cloud. No accounts. No internet required.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --bg: #030508;
  --bg2: #07090f;
  --surface: #0c1018;
  --border: #1c2636;
  --accent: #00ff9d;
  --accent2: #00b8ff;
  --accent3: #ff4560;
  --dim: #2e4058;
  --text: #d0dde8;
  --muted: #566878;
  --glow: rgba(0,255,157,0.18);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.7;overflow-x:hidden}

body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.03) 3px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:9999}

.grid-bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,157,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,157,0.025) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;border-bottom:1px solid var(--border);background:rgba(3,5,8,0.92);backdrop-filter:blur(16px)}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:17px;letter-spacing:.3em;color:var(--accent);text-shadow:0 0 24px rgba(0,255,157,.5);text-decoration:none}
.logo-slash{color:var(--muted);font-weight:300}
nav ul{list-style:none;display:flex;gap:28px;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.15em;text-transform:uppercase;transition:color .2s;font-family:'Share Tech Mono',monospace}
nav a:hover{color:var(--accent)}
.nav-ext{color:var(--accent2)!important}
.nav-ext:hover{color:#fff!important}
.nav-cta{border:1px solid var(--accent)!important;color:var(--accent)!important;padding:7px 18px;transition:background .2s,box-shadow .2s!important}
.nav-cta:hover{background:var(--accent)!important;color:var(--bg)!important;box-shadow:0 0 20px var(--glow)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:6px}
.hamburger span{display:block;width:22px;height:2px;background:var(--accent);transition:all .3s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
.mobile-menu{display:none;position:fixed;top:64px;left:0;right:0;background:rgba(3,5,8,.98);border-bottom:1px solid var(--border);z-index:199;flex-direction:column;backdrop-filter:blur(20px)}
.mobile-menu.open{display:flex}
.mobile-menu a{color:var(--muted);text-decoration:none;padding:16px 32px;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid var(--border);font-family:'Share Tech Mono',monospace;transition:color .2s,background .2s}
.mobile-menu a:last-child{border:none}
.mobile-menu a:hover{color:var(--accent);background:rgba(0,255,157,.04)}

/* HERO */
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 24px 60px;z-index:1;overflow:hidden}
.hero-glow{position:absolute;width:700px;height:700px;background:radial-gradient(circle,rgba(0,255,157,.07) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.hero-glow2{position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(0,184,255,.05) 0%,transparent 65%);top:30%;left:70%;transform:translate(-50%,-50%);pointer-events:none}

.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);color:var(--muted);font-size:11px;letter-spacing:.22em;text-transform:uppercase;padding:8px 18px;margin-bottom:36px;animation:fadeUp .7s ease both;font-family:'Share Tech Mono',monospace;background:rgba(0,255,157,.02)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.5s infinite;flex-shrink:0}

.hero h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(48px,11vw,110px);line-height:.88;letter-spacing:-.02em;color:#fff;animation:fadeUp .7s .08s ease both;margin-bottom:4px}
.line2{display:block;color:var(--accent);text-shadow:0 0 60px rgba(0,255,157,.4)}
.hero-tagline{font-family:'Orbitron',sans-serif;font-size:clamp(10px,1.8vw,14px);letter-spacing:.4em;color:var(--muted);text-transform:uppercase;margin:18px 0 32px;animation:fadeUp .7s .16s ease both}

.hero-desc{max-width:520px;color:var(--muted);font-size:15px;line-height:1.85;margin-bottom:40px;animation:fadeUp .7s .24s ease both}
.hero-desc strong{color:var(--text)}

.hero-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;animation:fadeUp .7s .32s ease both;margin-bottom:40px}
.btn-primary{background:var(--accent);color:var(--bg);border:none;padding:15px 34px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:box-shadow .25s,transform .2s;font-weight:600;display:inline-block}
.btn-primary:hover{box-shadow:0 0 36px rgba(0,255,157,.55);transform:translateY(-2px)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);padding:15px 34px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:border-color .2s,color .2s,background .2s;display:inline-block}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,255,157,.04)}

.trust-row{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 24px;animation:fadeUp .7s .4s ease both}
.trust-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-family:'Share Tech Mono',monospace}
.trust-item::before{content:'✓';color:var(--accent);font-size:13px}

/* STATS BAR */
.stats-bar{position:relative;z-index:1;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;justify-content:center;overflow-x:auto;scrollbar-width:none;background:var(--bg2)}
.stats-bar::-webkit-scrollbar{display:none}
.stat-item{display:flex;align-items:center;gap:14px;padding:22px 40px;border-right:1px solid var(--border);flex-shrink:0}
.stat-item:last-child{border-right:none}
.stat-num{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;color:var(--accent)}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;line-height:1.5;font-family:'Share Tech Mono',monospace}

/* SECTIONS */
section{position:relative;z-index:1;padding:90px 40px;max-width:1160px;margin:0 auto}
.section-eyebrow{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.35em;color:var(--accent);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-eyebrow::before{content:'//';color:var(--dim)}
.section-title{font-family:'Orbitron',sans-serif;font-size:clamp(26px,4.5vw,48px);font-weight:900;color:#fff;line-height:1.1;margin-bottom:20px;letter-spacing:-.02em}
.section-title span{color:var(--accent)}
.section-lead{color:var(--muted);max-width:560px;font-size:15px;line-height:1.9;margin-bottom:48px}
.full-divider{border:none;border-top:1px solid var(--border);position:relative;z-index:1}

/* EXPLAINER CARDS */
.explainer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border)}
.explainer-card{background:var(--bg2);padding:44px 36px;transition:background .3s;position:relative;overflow:hidden;cursor:default}
.explainer-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.explainer-card:hover{background:var(--surface)}
.explainer-card:hover::after{transform:scaleX(1)}
.card-icon{width:52px;height:52px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:22px;transition:border-color .3s,box-shadow .3s}
.explainer-card:hover .card-icon{border-color:var(--accent);box-shadow:0 0 20px var(--glow)}
.card-label{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.card-title{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:.1em;color:#fff;margin-bottom:12px}
.card-body{color:var(--muted);font-size:13px;line-height:1.85}
.card-body code{background:rgba(0,255,157,.08);color:var(--accent);padding:1px 6px;font-family:'Share Tech Mono',monospace;font-size:12px}

/* STEPS */
.steps-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--border);border:1px solid var(--border)}
.step-card{background:var(--bg2);padding:40px 36px;display:flex;gap:22px;transition:background .3s}
.step-card:hover{background:var(--surface)}
.step-num{font-family:'Orbitron',sans-serif;font-size:40px;font-weight:900;color:var(--border);line-height:1;flex-shrink:0;width:56px;transition:color .3s}
.step-card:hover .step-num{color:var(--accent)}
.step-title{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.15em;color:#fff;margin-bottom:10px;text-transform:uppercase}
.step-body{color:var(--muted);font-size:13px;line-height:1.85}

/* FEATURES */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feat-card{border:1px solid var(--border);padding:28px;background:var(--bg2);transition:border-color .3s,box-shadow .3s,background .3s;position:relative;overflow:hidden}
.feat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.feat-card:hover{border-color:rgba(0,255,157,.3);box-shadow:0 4px 32px rgba(0,255,157,.06);background:var(--surface)}
.feat-card:hover::before{transform:scaleX(1)}
.feat-tag{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.3em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px}
.feat-name{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;color:#fff;margin-bottom:10px}
.feat-body{color:var(--muted);font-size:13px;line-height:1.8}
.feat-body code{color:var(--accent);font-family:'Share Tech Mono',monospace;font-size:12px}

/* INSTALL */
.os-row{display:flex;border:1px solid var(--border);width:fit-content}
.os-btn{background:var(--bg2);border:none;border-right:1px solid var(--border);color:var(--muted);padding:11px 26px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.18em;cursor:pointer;transition:background .2s,color .2s;text-transform:uppercase}
.os-btn:last-child{border-right:none}
.os-btn.active,.os-btn:hover{background:var(--surface);color:var(--accent)}
.terminal{background:#000;border:1px solid var(--border);border-top:none;overflow:hidden}
.terminal-bar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border);background:#070c10;user-select:none}
.t-dot{width:11px;height:11px;border-radius:50%;cursor:pointer;transition:opacity .2s}
.t-dot:hover{opacity:.7}
.t-dot.red{background:#ff4560}
.t-dot.yellow{background:#ffb800}
.t-dot.green{background:#00ff9d}
.term-title-el{margin-left:auto;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.08em}
#run-btn{background:var(--accent);color:var(--bg);border:none;padding:5px 16px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.15em;cursor:pointer;transition:opacity .2s,background .2s;text-transform:uppercase;font-weight:700;margin-left:12px}
#run-btn:disabled{background:var(--dim);color:var(--muted);cursor:default}
#run-btn:not(:disabled):hover{background:#00e88a}
.terminal-body{padding:24px 28px;font-family:'Share Tech Mono',monospace;font-size:13px;line-height:2;min-height:260px;max-height:380px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.terminal-body::-webkit-scrollbar{width:4px}
.terminal-body::-webkit-scrollbar-thumb{background:var(--border)}
.t-line{display:flex;gap:14px;align-items:flex-start}
.t-prompt{color:var(--accent);flex-shrink:0}
.t-cmd{color:#e0ede0}
.t-comment{color:var(--dim)}
.t-output{color:var(--muted);padding-left:24px}
.t-success{color:var(--accent);padding-left:24px}
.t-error{color:var(--accent3);padding-left:24px}
.blink{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:middle;margin-left:3px;animation:blink 1s step-end infinite}

.progress-box{display:none;margin-top:20px;border:1px solid var(--border);padding:24px 28px;background:var(--bg2)}
.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.progress-label{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.2em;color:#fff}
#progress-pct{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--accent)}
.progress-track{background:var(--border);height:5px;width:100%;overflow:hidden}
#progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease;box-shadow:0 0 12px rgba(0,255,157,.4)}
.progress-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.p-step{color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.05em;text-align:center;padding:8px 4px;border:1px solid transparent;transition:all .3s}
.p-step.done{color:var(--accent);border-color:rgba(0,255,157,.15);background:rgba(0,255,157,.04)}
.p-step.active{color:var(--accent2);animation:pulse .8s infinite}

/* HARDWARE */
.hw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border)}
.hw-card{background:var(--bg2);padding:36px 24px;text-align:center;transition:background .3s}
.hw-card:hover{background:var(--surface)}
.hw-emoji{font-size:32px;margin-bottom:14px}
.hw-name{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:.15em;color:#fff;margin-bottom:6px}
.hw-price{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--accent);margin-bottom:12px}
.hw-desc{font-size:12px;color:var(--muted);line-height:1.7}

/* MODES */
.modes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px}
.mode-card{border:1px solid var(--border);padding:36px;background:var(--bg2);transition:border-color .3s,background .3s}
.mode-card:hover{border-color:rgba(0,255,157,.25);background:var(--surface)}
.mode-badge{display:inline-block;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:.3em;text-transform:uppercase;padding:4px 12px;margin-bottom:16px;border:1px solid}
.mode-badge.m1{color:var(--accent2);border-color:var(--accent2);background:rgba(0,184,255,.07)}
.mode-badge.m2{color:var(--accent);border-color:var(--accent);background:rgba(0,255,157,.07)}
.mode-title{font-family:'Orbitron',sans-serif;font-size:15px;font-weight:700;color:#fff;margin-bottom:16px}
.mode-items{list-style:none;display:flex;flex-direction:column;gap:9px}
.mode-items li{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.chk{color:var(--accent);font-family:'Share Tech Mono',monospace}
.crs{color:var(--dim);font-family:'Share Tech Mono',monospace}

/* DONATE */
.donate-wrap{position:relative;z-index:1;background:var(--bg2);border-top:1px solid var(--border);padding:90px 40px;text-align:center}
.donate-inner{max-width:760px;margin:0 auto}
.wallet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px;text-align:left}
.wallet{border:1px solid var(--border);padding:26px;background:var(--bg);transition:border-color .3s,box-shadow .3s}
.wallet:hover{border-color:rgba(0,255,157,.3);box-shadow:0 4px 24px rgba(0,255,157,.05)}
.wallet-chain{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.wallet-symbol{font-size:26px;margin-bottom:12px}
.wallet-addr{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--dim);word-break:break-all;line-height:1.6;margin-bottom:14px}
.copy-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.15em;cursor:pointer;transition:all .2s;text-transform:uppercase}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--accent);color:var(--accent);background:rgba(0,255,157,.08)}

/* SOCIAL STRIP */
.social-strip{position:relative;z-index:1;border-top:1px solid var(--border);padding:28px 40px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;background:var(--bg)}
.social-link{display:inline-flex;align-items:center;gap:9px;color:var(--muted);text-decoration:none;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--border);padding:11px 22px;transition:all .2s}
.social-link:hover{color:var(--accent);border-color:var(--accent);background:rgba(0,255,157,.04)}
.social-link svg{flex-shrink:0}

/* FOOTER */
footer{position:relative;z-index:1;border-top:1px solid var(--border);padding:28px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;background:var(--bg)}
.footer-logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:15px;letter-spacing:.3em;color:var(--accent)}
.footer-links{list-style:none;display:flex;gap:24px;flex-wrap:wrap}
.footer-links a{color:var(--muted);text-decoration:none;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:color .2s}
.footer-links a:hover{color:var(--accent)}
.footer-copy{font-size:11px;color:var(--dim);font-family:'Share Tech Mono',monospace}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes scroll-pulse{0%{transform:scaleY(0);transform-origin:top;opacity:0}50%{transform:scaleY(1);transform-origin:top;opacity:1}100%{transform:scaleY(1);transform-origin:bottom;opacity:0}}
@keyframes glitch1{0%{clip:rect(24px,9999px,90px,0);transform:skew(.5deg)}20%{clip:rect(70px,9999px,100px,0);transform:skew(0)}40%{clip:rect(10px,9999px,30px,0);transform:skew(-.5deg)}60%{clip:rect(50px,9999px,120px,0);transform:skew(.3deg)}80%{clip:rect(5px,9999px,60px,0);transform:skew(0)}100%{clip:rect(24px,9999px,90px,0);transform:skew(.5deg)}}
@keyframes glitch2{0%{clip:rect(85px,9999px,140px,0);transform:skew(-.5deg)}20%{clip:rect(30px,9999px,50px,0);transform:skew(0)}40%{clip:rect(110px,9999px,160px,0);transform:skew(.5deg)}60%{clip:rect(15px,9999px,45px,0);transform:skew(-.3deg)}80%{clip:rect(75px,9999px,100px,0);transform:skew(0)}100%{clip:rect(85px,9999px,140px,0);transform:skew(-.5deg)}}

.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{left:2px;text-shadow:-2px 0 var(--accent3);clip:rect(24px,550px,90px,0);animation:glitch1 4s infinite}
.glitch::after{left:-2px;text-shadow:2px 0 var(--accent2);clip:rect(85px,550px,140px,0);animation:glitch2 4s infinite}

.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Sh
